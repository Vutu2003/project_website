spring:
  application:
    name: medical-equipment-maintenance
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    execute-in-transaction: false
    fail-on-missing-locations: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: 127.0.0.1
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
